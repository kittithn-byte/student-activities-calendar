function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(q){if(c==='"'&&n==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(c!=='\r')cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows}
const thaiMonth={'มกราคม':1,'กุมภาพันธ์':2,'มีนาคม':3,'เมษายน':4,'พฤษภาคม':5,'มิถุนายน':6,'กรกฎาคม':7,'สิงหาคม':8,'กันยายน':9,'ตุลาคม':10,'พฤศจิกายน':11,'ธันวาคม':12};
function dateParts(raw){raw=(raw||'').trim().replace(/[–—]/g,'-');let m=raw.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return [`${+m[1]>2400?+m[1]-543:+m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`];m=raw.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m){let y=+m[3];if(y>2400)y-=543;return [`${y}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`]}let out=[];for(const [name,mon] of Object.entries(thaiMonth)){const re=new RegExp('(\\d{1,2})(?:\\s*-\\s*(\\d{1,2}))?\\s*'+name+'\\s*(\\d{2,4})','g');for(const a of raw.matchAll(re)){let y=+a[3];if(y<100)y+=2500;if(y>2400)y-=543;const d1=+a[1],d2=+(a[2]||a[1]);if(d2-d1<40)for(let d=d1;d<=d2;d++)out.push(`${y}-${String(mon).padStart(2,'0')}-${String(d).padStart(2,'0')}`)}}return [...new Set(out)]}
function loadPublishedSheet(){
 if(!SHEET_CSV_URL||SHEET_CSV_URL.includes('วางลิงก์'))return;
 fetch(SHEET_CSV_URL+(SHEET_CSV_URL.includes('?')?'&':'?')+'v='+Date.now())
 .then(r=>{if(!r.ok)throw Error('CSV request failed');return r.text()})
 .then(csv=>{
  const rows=parseCSV(csv);if(rows.length<3)throw Error('CSV has no event rows');
  const h=rows[0].map(x=>(x||'').trim()),sub=(rows[1]||[]).map(x=>(x||'').trim());
  const col=(name,fallback)=>{const i=h.indexOf(name);return i>=0?i:fallback};
  const c={start:col('วันเริ่มกิจกรรม',1),end:col('วันสิ้นสุดกิจกรรม',2),timeStart:col('เวลาเริ่มต้น',3),timeEnd:col('เวลาสิ้นสุด',4),title:col('โครงการ / กิจกรรม',5),place:col('สถานที่ / ช่องทางการดำเนินงาน',6),year:sub.indexOf('ชั้นปี')>=0?sub.indexOf('ชั้นปี'):7,major:sub.indexOf('สาขาวิชา')>=0?sub.indexOf('สาขาวิชา'):8,type:col('ประเภทกิจกรรม',9),hours:col('จำนวนชั่วโมง',10),owner:col('หน่วยงานรับผิดชอบกิจกรรม',11),dress:col('การแต่งกาย',12),note:col('หมายเหตุ',13)};
  const val=(r,i)=>(r[i]||'').trim();
  const data=[];
  for(const r of rows.slice(2)){
   const title=val(r,c.title);if(!title)continue;
   const startRaw=val(r,c.start),endRaw=val(r,c.end);let startDates=dateParts(startRaw),endDates=dateParts(endRaw);
   if(!startDates.length)startDates=endDates;if(!startDates.length)continue;
   let first=startDates[0],last=endDates.length?endDates[endDates.length-1]:startDates[startDates.length-1];
   if(first>last)[first,last]=[last,first];
   const spans=first!==last?[[first,last]]:[],dates=spans.length?[]:[first];
   const t1=val(r,c.timeStart),t2=val(r,c.timeEnd),time=!t1&&!t2?'ไม่ระบุ':!t1?t2:!t2||t1===t2?t1:`${t1} – ${t2}`;
   const year=val(r,c.year),major=val(r,c.major),dateLabel=startRaw&&endRaw&&startRaw!==endRaw?`${startRaw} – ${endRaw}`:startRaw||endRaw;
   data.push({date:first,dates,spans,dateLabel,time,title,place:val(r,c.place)||'ไม่ระบุ',year:year||'ไม่ระบุ',major:major||'ไม่ระบุ',aud:[year,major],type:val(r,c.type)||'ไม่ระบุ',hours:val(r,c.hours),owner:val(r,c.owner)||'ไม่ระบุ',dress:val(r,c.dress)||'ไม่ระบุ',note:val(r,c.note)});
  }
  if(data.length){events=data;document.querySelector('#type').innerHTML='<option value="">กิจกรรมทุกประเภท</option>'+[...new Set(events.map(e=>e.type).filter(x=>x&&x!=='ไม่ระบุ'))].map(x=>`<option>${x}</option>`).join('');draw()}
 }).catch(err=>console.warn('โหลดข้อมูลชีตไม่สำเร็จ จะแสดงข้อมูลล่าสุดที่บันทึกไว้ในไฟล์',err));
}
let view=new Date(2026,9,1),selected='';const thMonths=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;function matches(e){const q=document.querySelector('#search').value.toLowerCase(),t=document.querySelector('#type').value;return(!q||[e.title,e.place,e.owner,e.type,e.year,e.major].join(' ').toLowerCase().includes(q))&&(!t||e.type===t)}function inDay(e,k){return e.dates.includes(k)||e.spans.some(([a,b])=>k>=a&&k<=b)}function thaiDate(s){if(!s)return'ไม่ระบุ';const d=new Date(s+'T00:00:00');return `${d.getDate()} ${thMonths[d.getMonth()]} ${d.getFullYear()+543}`}function card(e){return `<article class="event"><h4>${e.title}</h4><div class="meta">📅 ${e.dateLabel}<br>🕒 ${e.time}<br>📍 ${e.place}<br>👥 ${[e.year,e.major].filter(x=>x&&x!=='ไม่ระบุ').join(' · ')||'ไม่ระบุ'}<br>หน่วยงาน: ${e.owner}${e.hours?'<br>ชั่วโมงกิจกรรม: '+e.hours:''}<br>การแต่งกาย: ${e.dress}${e.note?'<br>หมายเหตุ: '+e.note:''}</div><span class="badge">${e.type}</span></article>`}function showDay(d){const list=events.filter(matches).filter(e=>inDay(e,key(d)));document.querySelector('#detailTitle').textContent=`${d.getDate()} ${thMonths[d.getMonth()]} ${d.getFullYear()+543}`;document.querySelector('#detailSub').textContent=`${list.length} กิจกรรม`;document.querySelector('#details').innerHTML=list.length?list.map(card).join(''):'<div class="empty">ไม่พบกิจกรรมที่ระบุวันที่ตรงกับวันนี้</div>'}function showMonth(){const prefix=key(new Date(view.getFullYear(),view.getMonth(),1)).slice(0,7),list=events.filter(matches).filter(e=>e.dates.some(x=>x.startsWith(prefix))||e.spans.some(([a,b])=>a.slice(0,7)<=prefix&&b.slice(0,7)>=prefix));document.querySelector('#detailTitle').textContent=`กิจกรรมเดือน${thMonths[view.getMonth()]}`;document.querySelector('#detailSub').textContent=`${list.length} รายการที่มีกำหนดวันที่ในเดือนนี้`;const undated=events.filter(matches).filter(e=>!e.dates.length&&!e.spans.length);document.querySelector('#details').innerHTML=(list.length?list.map(card).join(''):'<div class="empty">ไม่มีรายการที่ระบุวันที่ในเดือนนี้</div>')+(undated.length?'<h3 style="margin-top:16px">กิจกรรมรอกำหนดวัน</h3>'+undated.map(card).join(''):'')}function draw(){document.querySelector('#monthTitle').textContent=`${thMonths[view.getMonth()]} ${view.getFullYear()+543}`;const first=new Date(view.getFullYear(),view.getMonth(),1),start=new Date(first);start.setDate(first.getDate()-first.getDay());const g=document.querySelector('#grid');g.innerHTML='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const cell=document.createElement('div');cell.className='day'+(d.getMonth()!==view.getMonth()?' dim':'')+(selected===key(d)?' selected':'');cell.innerHTML=`<span class="daynum">${d.getDate()}</span>`;const list=events.filter(matches).filter(e=>inDay(e,key(d)));list.slice(0,2).forEach(e=>{const x=document.createElement('span');x.className='eventdot';x.textContent=e.title;cell.append(x)});if(list.length>2){const m=document.createElement('div');m.className='more';m.textContent=`+${list.length-2} รายการ`;cell.append(m)}cell.onclick=()=>{selected=key(d);draw();showDay(d)};g.append(cell)}if(!selected)showMonth()}[...new Set(events.map(e=>e.type).filter(x=>x&&x!=='ไม่ระบุ'))].forEach(x=>document.querySelector('#type').insertAdjacentHTML('beforeend',`<option>${x}</option>`));document.querySelector('#prev').onclick=()=>{view.setMonth(view.getMonth()-1);selected='';draw()};document.querySelector('#next').onclick=()=>{view.setMonth(view.getMonth()+1);selected='';draw()};document.querySelector('#today').onclick=()=>{view=new Date();selected=key(view);draw();showDay(view)};['search','type'].forEach(id=>document.querySelector('#'+id).addEventListener(id==='search'?'input':'change',()=>{selected='';draw()}));draw();loadPublishedSheet();
</script></body></html>
