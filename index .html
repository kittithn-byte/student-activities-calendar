<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ปฏิทินกิจกรรมนักศึกษา | บพิตรพิมุข จักรวรรดิ</title><style>
:root{--navy:#142c50;--blue:#23598c;--gold:#d7a64a;--paper:#f5f7fa;--ink:#1d2938;--muted:#6c7888;--line:#e1e7ef}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.hero{background:linear-gradient(120deg,#102542,#1d4f7a);color:white;padding:28px max(22px,calc((100vw - 1120px)/2));border-bottom:4px solid var(--gold)}.brand{font-size:13px;color:#d9e7f5;letter-spacing:.03em}.hero h1{font-size:clamp(24px,4vw,36px);margin:8px 0 4px}.hero p{margin:0;color:#d2deeb}.wrap{max-width:1120px;margin:auto;padding:24px 20px 54px}.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:17px}.month{display:flex;align-items:center;gap:10px}.month h2{margin:0;font-size:25px;min-width:180px}.btn{border:1px solid var(--line);background:white;color:var(--navy);padding:9px 13px;border-radius:10px;font-size:18px;cursor:pointer}.today{font-size:14px;padding:9px 14px}.filters{display:grid;grid-template-columns:minmax(200px,1fr) 190px 190px;gap:10px;margin:14px 0 18px}.filters input,.filters select{background:white;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);font:inherit;width:100%}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.calendar,.side{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.dow{background:#f8fafc;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px;text-align:center;padding:11px 0}.day{min-height:102px;padding:8px;border-right:1px solid #edf0f4;border-bottom:1px solid #edf0f4;cursor:pointer;position:relative}.day:nth-child(7n){border-right:0}.day:hover{background:#f7faff}.day.dim{color:#b7c0cb;background:#fbfcfd}.daynum{font-size:13px;font-weight:650}.day.selected{box-shadow:inset 0 0 0 2px var(--blue);background:#f4f8fc}.eventdot{display:block;margin-top:5px;border-radius:5px;background:#e8f0fa;color:#234f7b;padding:3px 5px;font-size:11px;line-height:1.25;overflow:hidden;max-height:32px}.eventdot.academic{background:#e8f4ef;color:#237052}.eventdot.culture{background:#fff3df;color:#94641b}.eventdot.ethics{background:#f3edfa;color:#704c8d}.eventdot.other{background:#edf0f3;color:#4f5d6d}.more{font-size:10px;color:var(--muted);padding:2px 4px}.side{padding:18px;align-self:start}.side h3{font-size:18px;margin:0 0 4px}.side .sub{font-size:13px;color:var(--muted);margin:0 0 14px}.event{border-top:1px solid var(--line);padding:13px 0}.event h4{margin:0 0 7px;font-size:14px;line-height:1.45}.meta{font-size:12px;color:#5f6c7b;line-height:1.65}.badge{display:inline-block;padding:3px 8px;border-radius:99px;background:#eff3f8;color:#3c5874;font-size:11px;margin-top:7px}.empty{padding:28px 4px;color:var(--muted);font-size:14px}.foot{font-size:12px;color:var(--muted);margin-top:14px}.mobile-list{display:none}.hidden{display:none}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{order:2}.day{min-height:74px;padding:6px 4px}.eventdot{font-size:10px}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.month h2{font-size:21px;min-width:150px}.bar{align-items:flex-start}.calendar{overflow-x:auto}.dow,.grid{min-width:630px}}@media(max-width:500px){.wrap{padding:18px 12px 40px}.hero{padding:22px 16px}.day{min-height:64px}.eventdot{height:8px;padding:0;font-size:0;border-radius:20px}.more{font-size:9px;padding:2px 0}.today{display:none}.month h2{min-width:138px;font-size:19px}}
</style></head><body><header class="hero"><div class="brand">คณะบริหารธุรกิจ · บพิตรพิมุข จักรวรรดิ</div><h1>ปฏิทินกิจกรรมนักศึกษา</h1><p>รวมกิจกรรม ข่าวสาร และกำหนดการสำหรับนักศึกษา</p></header><main class="wrap"><div class="bar"><div class="month"><button class="btn" id="prev" aria-label="เดือนก่อน">‹</button><h2 id="monthTitle"></h2><button class="btn" id="next" aria-label="เดือนถัดไป">›</button></div><button class="btn today" id="today">วันนี้</button></div><div class="filters"><input id="search" type="search" placeholder="ค้นหาชื่อกิจกรรม สถานที่ หรือหน่วยงาน…"><select id="type"><option value="">กิจกรรมทุกประเภท</option></select><select id="audience"><option value="">นักศึกษาทุกกลุ่ม</option></select></div><div class="layout"><section class="calendar"><div class="dow"><div>อา.</div><div>จ.</div><div>อ.</div><div>พ.</div><div>พฤ.</div><div>ศ.</div><div>ส.</div></div><div id="grid" class="grid"></div></section><aside class="side"><h3 id="detailTitle">กิจกรรมในเดือนนี้</h3><p class="sub" id="detailSub">เลือกวันที่ในปฏิทินเพื่อดูรายละเอียด</p><div id="details"></div><div class="foot">ข้อมูลอ้างอิงจากปฏิทินกิจกรรมนักศึกษา</div></aside></div></main><script>
// ดึงกิจกรรมจาก Google Sheets ที่เผยแพร่เป็น CSV
// วาง URL CSV ไว้ระหว่างเครื่องหมายอัญประกาศด้านล่าง
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSeFwvcZRZko2ZDX-I06cn0OGh3d0iZqZkF6Td-GSUsPplRnv1AVU87G-201UIQxRInfCWs6t6n2UqR/pub?output=csv';
let events=[];
function parseCSV(text){
 const rows=[]; let row=[],cell='',quoted=false;
 for(let i=0;i<text.length;i++){
  const c=text[i],n=text[i+1];
  if(quoted){if(c==='"'&&n==='"'){cell+='"';i++}else if(c==='"'){quoted=false}else cell+=c}
  else if(c==='"')quoted=true;
  else if(c===','){row.push(cell);cell=''}
  else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}
  else if(c!=='\r')cell+=c;
 }
 if(cell.length||row.length){row.push(cell);rows.push(row)}
 return rows;
}
function loadSheet(){
 if(SHEET_CSV_URL==='วางลิงก์ CSV ที่นี่'){
  document.querySelector('#details').innerHTML='<div class="empty">ยังไม่ได้ใส่ลิงก์ Google Sheets CSV ในโค้ดเว็บ</div>';return;
 }
 fetch(SHEET_CSV_URL+'&cache='+Date.now())
  .then(r=>{if(!r.ok)throw new Error('โหลดชีตไม่สำเร็จ');return r.text()})
  .then(csv=>{
   const rows=parseCSV(csv),headers=rows.shift().map(x=>x.trim());
   const col=name=>headers.indexOf(name);
   const val=(r,name)=>{const i=col(name);return i<0?'':(r[i]||'').trim()};
   events=rows.map(r=>({
    date:val(r,'วันที่เริ่ม'),end:val(r,'วันที่สิ้นสุด')||val(r,'วันที่เริ่ม'),
    time:val(r,'เวลา'),title:val(r,'ชื่อกิจกรรม'),place:val(r,'สถานที่'),
    aud:val(r,'กลุ่มเป้าหมาย'),type:val(r,'ประเภท'),owner:val(r,'ผู้รับผิดชอบ'),dress:val(r,'การแต่งกาย')
   })).filter(e=>/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&e.title);
   const types=[...new Set(events.map(e=>e.type).filter(Boolean))];
   const audiences=[...new Set(events.flatMap(e=>(e.aud||'').split(/[·,]/).map(x=>x.trim())).filter(x=>x.includes('ชั้นปี')))];
   document.querySelector('#type').innerHTML='<option value="">กิจกรรมทุกประเภท</option>'+types.map(x=>`<option>${x}</option>`).join('');
   document.querySelector('#audience').innerHTML='<option value="">นักศึกษาทุกกลุ่ม</option>'+audiences.map(x=>`<option>${x}</option>`).join('');
   draw();
  }).catch(()=>{document.querySelector('#details').innerHTML='<div class="empty">โหลดข้อมูลไม่สำเร็จ กรุณาตรวจลิงก์ CSV และการเผยแพร่ชีต</div>'});
}
let view=new Date(2026,10,1),selected=null;const thMonths=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;function matches(e){let q=document.querySelector('#search').value.toLowerCase(),t=document.querySelector('#type').value,a=document.querySelector('#audience').value;return (!q||[e.title,e.place,e.owner,e.aud,e.type].join(' ').toLowerCase().includes(q))&&(!t||e.type===t)&&(!a||e.aud.includes(a))}function dateText(s){let d=new Date(s+'T00:00:00');return `${d.getDate()} ${thMonths[d.getMonth()]} ${d.getFullYear()+543}`}function draw(){document.querySelector('#monthTitle').textContent=`${thMonths[view.getMonth()]} ${view.getFullYear()+543}`;let first=new Date(view.getFullYear(),view.getMonth(),1),start=new Date(first);start.setDate(first.getDate()-first.getDay());let g=document.querySelector('#grid');g.innerHTML='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let cell=document.createElement('div');cell.className='day'+(d.getMonth()!==view.getMonth()?' dim':'')+(selected===key(d)?' selected':'');cell.innerHTML=`<span class="daynum">${d.getDate()}</span>`;let list=events.filter(e=>matches(e)&&key(d)>=e.date&&key(d)<=(e.end||e.date));list.slice(0,2).forEach(e=>{let dot=document.createElement('span');dot.className='eventdot '+(e.type.includes('วิชาการ')?'academic':e.type.includes('วัฒนธรรม')?'culture':e.type.includes('คุณธรรม')?'ethics':'');dot.textContent=e.title;cell.append(dot)});if(list.length>2){let m=document.createElement('div');m.className='more';m.textContent=`+${list.length-2} กิจกรรม`;cell.append(m)}cell.onclick=()=>{selected=key(d);draw();showDay(d)};g.append(cell)}if(!selected)showMonth()}function card(e){return `<article class="event"><h4>${e.title}</h4><div class="meta">📅 ${dateText(e.date)}${e.end?' – '+dateText(e.end):''}<br>🕒 ${e.time||'รอระบุ'}<br>📍 ${e.place||'รอระบุ'}<br>👥 ${e.aud||'รอระบุ'}<br>ผู้รับผิดชอบ: ${e.owner||'รอระบุ'}${e.dress?'<br>การแต่งกาย: '+e.dress:''}</div><span class="badge">${e.type}</span></article>`}function showDay(d){let list=events.filter(e=>matches(e)&&key(d)>=e.date&&key(d)<=(e.end||e.date));document.querySelector('#detailTitle').textContent=`${d.getDate()} ${thMonths[d.getMonth()]} ${d.getFullYear()+543}`;document.querySelector('#detailSub').textContent=`${list.length} กิจกรรม`;document.querySelector('#details').innerHTML=list.length?list.map(card).join(''):'<div class="empty">ไม่พบกิจกรรมในวันที่เลือก</div>'}function showMonth(){let list=events.filter(matches).filter(e=>e.date.slice(0,7)===key(new Date(view.getFullYear(),view.getMonth(),1)).slice(0,7));document.querySelector('#detailTitle').textContent=`กิจกรรมเดือน${thMonths[view.getMonth()]}`;document.querySelector('#detailSub').textContent=`${list.length} รายการ · เลือกวันที่เพื่อดูเฉพาะวัน`;document.querySelector('#details').innerHTML=list.length?list.map(card).join(''):'<div class="empty">ไม่พบกิจกรรมในเดือนนี้</div>'}document.querySelector('#prev').onclick=()=>{view.setMonth(view.getMonth()-1);selected=null;draw()};document.querySelector('#next').onclick=()=>{view.setMonth(view.getMonth()+1);selected=null;draw()};document.querySelector('#today').onclick=()=>{view=new Date();selected=key(view);draw();showDay(view)};['search','type','audience'].forEach(id=>document.querySelector('#'+id).addEventListener(id==='search'?'input':'change',()=>draw()));loadSheet();
</script></body></html>
